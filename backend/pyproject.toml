[project]
name = "forge-runtime"
version = "0.1.0"
description = "FORGE: self-optimizing, verifiable agent workflow runtime on Nebius + NVIDIA Nemotron"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "boto3>=1.34",
  "jsonschema>=4.22",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs Postgres (docker compose up -d postgres)",
  "live: calls the real Nebius API (needs NEBIUS_API_KEY); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
